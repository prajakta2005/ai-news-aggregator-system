services:
  postgres:
    image: postgres:16-alpine
    container_name: news_aggregator_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: news_user
      POSTGRES_PASSWORD: news_password
      POSTGRES_DB: news_aggregator
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news_user -d news_aggregator"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: