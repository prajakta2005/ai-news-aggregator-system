[project]
name = "ai-news-aggregator"
version = "0.1.0"
description = "AI-powered news aggregation system that curates AI developments from RSS feeds and blogs"
readme = "Readme.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "feedparser>=6.0",
    "google-genai>=1.0",
    "httpx>=0.27",
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "trafilatura>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
ai-news = "app.pipeline.daily:run_daily_pipeline"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
